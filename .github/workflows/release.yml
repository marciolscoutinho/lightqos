name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  PYTHON_VERSION: "3.11"
  RUST_VERSION: stable

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag or manual run
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="manual"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Validate frontend package metadata
        run: |
          test -f frontend/pyproject.toml
          grep -n '^version' frontend/pyproject.toml

      - name: Validate Rust workspace metadata
        run: |
          test -f Cargo.toml
          cargo metadata --no-deps --format-version 1 > /tmp/lightqos-metadata.json
          echo "Rust workspace metadata validated"

  build-wheels:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build wheel
        run: |
          maturin build \
            --manifest-path kernel/Cargo.toml \
            --features pyo3/extension-module \
            --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-wheels]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
