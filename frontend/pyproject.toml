[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightqos-sdk"
version = "0.1.0"
description = "Python SDK for LightQOS"
requires-python = ">=3.10"
authors = [
    { name = "Márcio Coutinho", email = "marciolscoutinho@gmail.com" }
]
dependencies = [
    "numpy>=1.24"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lightqos*"]
