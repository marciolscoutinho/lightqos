[package]
name = "lightqos"
version = "0.1.0"
edition = "2021"
authors = ["LightQOS Team"]
description = "Light Quantum Operating System - Rust Kernel"
license = "MIT"

[lib]
name = "lightqos_kernel"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.24.2", features = ["extension-module", "auto-initialize"] }
pyo3-async-runtimes = { version = "0.24.0", features = ["tokio-runtime"] }

# Core dependencies
nalgebra = { version = "0.35", features = ["serde-serialize"] }
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["serde", "v4"] }
thiserror = "1.0"

# Async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Random
rand = "0.8"

# Time
chrono = "0.4"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "emf_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[build-dependencies]
pyo3-build-config = "0.24.2"
